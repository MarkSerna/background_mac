name: Build Simulator for Appetize.io

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List and Select Best Xcode Version
        run: |
          ls -d /Applications/Xcode*
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Seleccionando: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Download U2Net Neural Network Model
        run: |
          mkdir -p Sources/BackgroundRemover/Resources
          if [ ! -f Sources/BackgroundRemover/Resources/u2netp.onnx ]; then
            echo "Descargando u2netp.onnx..."
            curl -L -o Sources/BackgroundRemover/Resources/u2netp.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          fi
          ls -lh Sources/BackgroundRemover/Resources/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project (Compatible ObjectVersion)
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' BackgroundRemover.xcodeproj/project.pbxproj || true

      - name: Build for iOS Simulator (Appetize Compatible)
        run: |
          xcodebuild build \
            -project BackgroundRemover.xcodeproj \
            -scheme BackgroundRemoverApp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify and Inject Neural Model in App Bundle
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphonesimulator -name "*.app" -type d | head -n 1)
          echo "App encontrada: $APP_PATH"
          cp Sources/BackgroundRemover/Resources/u2netp.onnx "$APP_PATH/u2netp.onnx" || true
          mkdir -p "$APP_PATH/Resources"
          cp Sources/BackgroundRemover/Resources/u2netp.onnx "$APP_PATH/Resources/u2netp.onnx" || true
          ls -la "$APP_PATH"

      - name: Upload Appetize Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundRemover-Simulator
          path: build/DerivedData/Build/Products/Release-iphonesimulator/BackgroundRemoverApp.app
          retention-days: 7
