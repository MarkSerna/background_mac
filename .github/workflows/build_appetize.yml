name: Build Simulator for Appetize.io

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16 / Latest
        run: |
          # Seleccionar la versión más reciente de Xcode disponible en el runner
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project (Xcode 15/16 Compatible)
        run: |
          xcodegen generate
          ls -la

      - name: Build for iOS Simulator (Appetize Compatible)
        run: |
          mkdir -p build/simulator
          
          xcodebuild build \
            -project BackgroundRemover.xcodeproj \
            -scheme BackgroundRemoverApp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App for Appetize.io
        run: |
          # Localizar el archivo .app compilado para el simulador
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphonesimulator -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          fi
          
          echo "App localizada en: $APP_PATH"
          
          mkdir -p build/simulator_package
          cp -r "$APP_PATH" build/simulator_package/BackgroundRemover.app
          
          cd build/simulator_package
          zip -r ../BackgroundRemover-Simulator.zip BackgroundRemover.app
          cd ../..
          
          echo "Archivo ZIP final generado con éxito:"
          ls -la build/BackgroundRemover-Simulator.zip

      - name: Upload Appetize Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundRemover-Simulator
          path: build/BackgroundRemover-Simulator.zip
          retention-days: 7
