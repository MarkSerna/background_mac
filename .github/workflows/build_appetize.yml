name: Build Simulator for Appetize.io

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build for iOS Simulator with xcodebuild
        run: |
          mkdir -p build/simulator
          
          # Compilar el paquete Swift apuntando al SDK del Simulador de iOS
          xcodebuild -scheme BackgroundRemoverApp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="build/Products"

      - name: Assemble Appetize App Bundle
        run: |
          APP_BUNDLE="build/simulator/BackgroundRemover.app"
          mkdir -p "$APP_BUNDLE"
          
          # Copiar Info.plist
          cp Sources/BackgroundRemover/Info.plist "$APP_BUNDLE/Info.plist"
          
          # Localizar el binario compilado dentro de DerivedData o Products
          BIN_PATH=$(find build/DerivedData -name "BackgroundRemoverApp" -type f -perm +111 | head -n 1)
          
          if [ -n "$BIN_PATH" ]; then
            echo "Encontrado binario: $BIN_PATH"
            cp "$BIN_PATH" "$APP_BUNDLE/BackgroundRemoverApp"
          else
            echo "Buscando en productos alternativos..."
            find build -type f
          fi
          
          # Comprimir el .app en .zip (formato requerido por Appetize.io)
          cd build/simulator
          zip -r BackgroundRemover-Simulator.zip BackgroundRemover.app
          cd ../..

      - name: Upload Appetize Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundRemover-Simulator
          path: build/simulator/BackgroundRemover-Simulator.zip
          retention-days: 7
