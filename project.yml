name: BackgroundRemover
options:
  bundleIdPrefix: com.dfiesta
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  objectVersion: 56

targets:
  BackgroundRemoverApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/BackgroundRemover
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: BackgroundRemoverApp
        PRODUCT_BUNDLE_IDENTIFIER: com.dfiesta.backgroundremover
        INFOPLIST_FILE: Sources/BackgroundRemover/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: $(inherited) -framework CoreML -framework Metal -framework Accelerate -framework Vision
